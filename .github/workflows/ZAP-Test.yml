name: ZAP-Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir zaproxy==0.4.0
          
      - name: Install JSON tools
        run: sudo apt-get install -y jq
                  
      - name: Run Juice Shop Container
        run: |
             docker pull bkimminich/juice-shop
             docker run -d --name vuln-app -p 3000:3000 bkimminich/juice-shop
      - name: Wait for container to start
        run: sleep 30
                             
      - name: Check Docker container logs and status
        run: |
          echo "Docker container logs:"
          docker logs vuln-app
          echo "Docker container status:"
          docker ps -a
            
      - name: Test application accessibility
        shell: bash
        run: |
          echo "Testing application accessibility:"
          curl -I http://localhost:3000 || echo "Warning: App may not be running properly"
          echo "Trying a simple GET request:"
          curl -v http://localhost:3000/ || echo "Warning: GET request failed"
               
      - name: Run ZAP Baseline Scan (via Docker)
        run: |
            docker run --network="host" \
            --user root \
            -v $(pwd):/zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3000 -j /zap/wrk/report.json || true
            
      - name: Verify ZAP Report Content
        run: |
          echo "Checking ZAP report content:"
          cat /zap/wrk/report.json
          
      - name: "Upload Report"
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-report
          path: zap-reports/zap-report.html
