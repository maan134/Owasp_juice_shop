name: ZAP-Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
                           
      - name: Run Juice Shop Container
        run: |
             docker pull bkimminich/juice-shop
             docker network create zapnet
             docker run -d --network zapnet --name vuln-app -p 3000:3000 bkimminich/juice-shop
      
      - name: Wait for container to start
        run: sleep 30
                             
      - name: Check Docker container logs and status
        run: |
          echo "Docker container logs:"
          docker logs vuln-app
          echo "Docker container status:"
          docker ps -a
                     
      - name: Run ZAP Baseline Scan (via Docker)
        run: |
          mkdir -p zap_reports
          chmod 777 zap_reports
          docker run --rm --network zapnet \
            -v $(pwd)/zap_reports:/zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://vuln-app:3000 -o zap_report.json -d || true

      - name: Verify report exists
        run: |
          echo "Listing working directory contents:"
          ls -la
          echo "Checking inside zap directory (if any):"
          ls -la /home/runner/work/* || true
          echo "Checking for reports in /zap/wrk folder (mounted volume):"
          docker run --rm -v $(pwd):/zap/wrk ghcr.io/zaproxy/zaproxy:stable ls -la /zap/wrk
                    
      - name: "Upload Report"
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-report
          path: zap_reports/
