name: DevSecOps Pipeline
on:
  workflow_dispatch:
jobs:
# 1. Checkout Code
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
  # 2. Install Dependencies
  install:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install -g @cyclonedx/cyclonedx-npm
        
  # 3. Static Application Security Testing (SAST)
  sast:
    runs-on: ubuntu-latest
    name: njsscan check
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
    - uses: actions/checkout@v4
    
    - name: nodejsscan scan
      id: njsscan
      uses: ajinabraham/njsscan-action@master
      with:
        args: '. --sarif --output results.sarif || true'
    - name: Upload njsscan report
      run : |
        cat results.sarif
        curl -X 'POST' \
        'https://demo.defectdojo.org/api/v2/reimport-scan/' \
        -H 'accept: application/json' \
        -H 'Authorization: Token 548afd6fab3bea9794a41b31da0e9404f733e222' \
        -H 'Content-Type: multipart/form-data' \
        -F 'test=66' \
        -F '[email protected];type=application/json' \
        -F file=@"results.sarif" \
        -F 'scan_type=SARIF' \
        -F 'tags=test'
    - name: upload report to github code scanning
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif
    - name: Upload Report as Artifact
      uses: actions/upload-artifact@v4
      with:
          name: NJSscan report
          path: |
            results.sarif

  npmAudit:
    runs-on: ubuntu-latest
    name: npmAudit library scanning
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4
    - name: npmAudit scan
      run : |
        curl -sL https://deb.nodesource.com/setup_20.x | sudo -E bash -
        sudo apt-get install -y nodejs
        npm install -g npm@6.14.18
    - name: Upload npmAudit report
      run : |
        npm i --package-lock-only
        npm audit --json >> npm_result.json | true
        cat npm_result.json
        curl -X 'POST' \
        'https://demo.defectdojo.org/api/v2/reimport-scan/' \
        -H 'accept: application/json' \
        -H 'Authorization: Token 548afd6fab3bea9794a41b31da0e9404f733e222' \
        -H 'Content-Type: multipart/form-data' \
        -F 'test=67' \
        -F '[email protected];type=application/json' \
        -F file=@"npm_result.json" \
        -F 'scan_type=NPM Audit Scan' \
        -F 'tags=test'
        
  sbom:
        runs-on: ubuntu-latest
        name: SBOM
        steps:
        - name: Checkout the code
          uses: actions/checkout@v4

             
        - name: Install dependencies
          run: npm install | npm install -g @cyclonedx/cyclonedx-npm
        - name: Generate SBOM in JSON
          run: |
           cyclonedx-npm --output-file sbom.json --output-format json
        - name: Upload SBOM and Scan Report
          uses: actions/upload-artifact@v4
          with:
            name: sbom-and-report
            path: |
              sbom.json
   # 6. Build and Deploy Container
  build-deploy:
    runs-on: ubuntu-latest
    
    steps:
       - name: Checkout repository
         uses: actions/checkout@v4
       - name: Run Juice Shop Container
         run: docker pull bkimminich/juice-shop | docker run -d -p 3000:3000 bkimminich/juice-shop
       - name: Wait for container to start
         run: sleep 30

  # 7. Dynamic Application Security Testing (DAST)
  dast:
    runs-on: ubuntu-latest
    #needs: build-deploy
    steps:
      - name: Run OWASP ZAP scan
        run: |
           touch zap.yaml
           chmod 666 zap.yaml
           mkdir -p $(pwd)/zap-reports
           chmod 777 $(pwd)/zap-reports
           docker run -v $(pwd):/zap/wrk/:rw -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
           -t https://preview.owasp-juice.shop -r /zap-reports/zap-report.html || true
        #mkdir -p zapwork && chmod -R 777 zapwork
           

        # docker run -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://host.docker.internal:3000 -r zap-report.html || true
        
              # docker run --network="host" \
              # -v $(pwd):/zap/wrk:rw \
              # owasp/zap2docker-stable zap-baseline.py \
              # -t http://localhost:3000 -r zap-report.html || true 
              
        # docker run -v $(pwd):/zap/wrk/:rw -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
          #  -t http://host.docker.internal:3000 -g gen.conf -r zap-report.html || true
            
        # docker run -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://host.docker.internal:3000 -r zap-report.html || true
          
      - name: Upload DAST report
        uses: actions/upload-artifact@v4
        with:
          name: dast-report
          path: /zap-reports/zap-report.html
        
  # 5. Secrets Scanning
  secrets-scan:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0
        - name: Secret Scanning
          run: |
            curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
            trufflehog --version
            trufflehog git https://github.com/${{ github.repository }} --results=verified,unknown --json > trufflehog_results.json
          #uses: trufflesecurity/trufflehog@main
          #with:
           # extra_args: --results=verified,unknown --json > trufflehog_results.json
          #continue-on-error: true
        - name: Upload Report as Artifact
          uses: actions/upload-artifact@v4
          with:
              name: Trufflehog report
              path: |
                trufflehog_results.json
            
